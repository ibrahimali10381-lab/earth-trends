<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>earth-trends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #eceae2;
      --muted: #8d8b82;
      --line: #34362e;
      --sheet: #171910;
      --space: #0e0f0c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--space);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Helvetica, sans-serif;
      font-weight: 400;
      overflow: hidden;
    }

    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .corner {
      position: fixed;
      top: 52px;
      left: 16px;
      right: auto;
      z-index: 3;
      width: 250px;
      padding: 14px 16px 16px;
      background: var(--sheet);
    }

    body.sidebar-open .corner { top: 124px; left: 16px; right: auto; }
    .corner[hidden] { display: none; }

    .menu {
      position: fixed;
      top: 16px;
      left: 16px;
      right: auto;
      z-index: 7;
      padding: 6px 10px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--sheet);
    }

    .sidebar {
      position: fixed;
      top: 56px;
      left: 16px;
      right: auto;
      bottom: auto;
      z-index: 6;
      width: 220px;
      padding: 14px 16px;
      background: var(--sheet);
      display: none;
      flex-direction: column;
    }

    .sidebar.open { display: flex; }

    .layer {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      text-align: left;
      padding-bottom: 4px;
    }

    .layer[aria-expanded="true"] { box-shadow: inset 0 -1px 0 currentColor; }

    .name, .date, .meta, .reading, .note, .ends, .legend h2 { margin: 0; }

    .name { font-size: 15px; font-weight: 600; }

    .date {
      margin-top: 14px;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .meta, .note, .ends, .coord, .legend h2 {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .meta { margin-top: 6px; }

    .reading {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      min-height: 4.4em;
    }

    .reading strong {
      display: block;
      font-weight: 600;
      font-size: 14px;
    }

    .coord { font-variant-numeric: tabular-nums; }

    .legend { margin-top: 18px; }
    .legend[hidden] { display: none; }
    .legend h2 { margin-bottom: 10px; font-weight: 600; }

    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
      font-size: 13px;
    }

    .swatch i { width: 10px; height: 10px; display: block; flex: none; }

    .note { margin-top: 12px; }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      gap: 28px;
      padding: 12px 22px 16px;
      background: var(--sheet);
    }

    .dock[hidden] { display: none; }
    .dock .timeline { flex: 1; min-width: 0; }

    .transport { display: flex; flex-wrap: wrap; gap: 8px 16px; }

    button {
      font: inherit;
      font-size: 14px;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0 0 2px;
      cursor: pointer;
    }

    button:hover { color: var(--ink); }

    button[aria-pressed="true"] {
      color: var(--ink);
      box-shadow: inset 0 -1px 0 currentColor;
    }

    button.bloom-on[aria-pressed="true"] { color: #e7a0ea; }

    .ends {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--line);
      outline: none;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--ink);
      border: 0;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      background: var(--ink);
      cursor: pointer;
    }

    .status {
      position: fixed;
      top: 18px;
      left: 96px;
      z-index: 2;
      margin: 0;
      font-size: 13px;
      color: var(--ink);
      display: none;
    }

    .status.show { display: block; }

    @media (max-width: 800px) {
      .corner, body.sidebar-open .corner { top: 124px; left: 12px; right: 12px; width: auto; }
      .menu { top: 12px; left: 12px; right: auto; }
      .sidebar { top: 52px; left: 12px; right: auto; width: min(220px, calc(100% - 24px)); }
      .dock { flex-wrap: wrap; gap: 12px; }
      .date { font-size: 22px; margin-top: 8px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <button id="menu" class="menu" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
  <div id="corner" class="corner" hidden>
    <header>
      <p class="name">earth-trends</p>
      <p class="date" id="date-line">Loading</p>
      <p class="meta">MODIS Terra, 8-day NDVI</p>
    </header>
    <div class="reading" id="reading">
      <strong id="klass">NDVI</strong>
      <span class="coord" id="coord">Move over land to sample a point.</span>
    </div>
    <section id="key" class="legend" hidden>
      <h2>Key</h2>
      <div class="swatch"><i style="background:#2e8000"></i> Dense vegetation</div>
      <div class="swatch"><i style="background:#7dba3a"></i> Moderate</div>
      <div class="swatch"><i style="background:#d2d2a4"></i> Sparse</div>
      <div class="swatch"><i style="background:#c8b5a5"></i> Bare or arid</div>
      <div class="swatch"><i style="background:#f15cff"></i> Greener than last month</div>
      <p class="note">Magenta is greener than the month before.</p>
    </section>
  </div>
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <button id="ndvi-toggle" class="layer" type="button" aria-expanded="false" aria-controls="ndvi-panel">NDVI</button>
  </aside>
  <div id="ndvi-panel" class="dock" hidden>
    <div class="transport">
      <button id="play" type="button">Play</button>
      <button id="bloom" type="button" class="bloom-on" aria-pressed="true">Bloom</button>
      <button id="spin" type="button" aria-pressed="true">Spin</button>
    </div>
    <div class="timeline">
      <div class="ends">
        <span>Mar 2025</span>
        <span id="frame-count"></span>
        <span>Nov 2026</span>
      </div>
      <input id="scrub" type="range" min="0" value="0" aria-label="NDVI month" />
    </div>
  </div>
  <p class="status" id="status" role="status"></p>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const frames = [];
    for (let year = 2025; year <= 2026; year++) {
      for (let month = 1; month <= 12; month++) {
        if (year === 2025 && month < 3) continue;
        if (year === 2026 && month > 11) continue;
        const day = year === 2026 && month === 11 ? 1 : 8;
        frames.push({ year, month, day });
      }
    }

    const dateLine = document.getElementById("date-line");
    const klassEl = document.getElementById("klass");
    const coordEl = document.getElementById("coord");
    const statusEl = document.getElementById("status");
    const playBtn = document.getElementById("play");
    const bloomBtn = document.getElementById("bloom");
    const spinBtn = document.getElementById("spin");
    const scrub = document.getElementById("scrub");
    const frameCount = document.getElementById("frame-count");
    const menuBtn = document.getElementById("menu");
    const sidebar = document.getElementById("sidebar");
    const ndviToggle = document.getElementById("ndvi-toggle");
    const ndviPanel = document.getElementById("ndvi-panel");
    const key = document.getElementById("key");
    const corner = document.getElementById("corner");

    menuBtn.addEventListener("click", () => {
      const open = sidebar.classList.toggle("open");
      menuBtn.setAttribute("aria-expanded", String(open));
      sidebar.setAttribute("aria-hidden", String(!open));
      document.body.classList.toggle("sidebar-open", open);
    });

    let ndviSelected = false;

    ndviToggle.addEventListener("click", () => {
      ndviSelected = !ndviSelected;
      ndviToggle.setAttribute("aria-expanded", String(ndviSelected));
      syncNdviLayer();
    });

    scrub.max = String(frames.length - 1);
    const startIndex = frames.findIndex((f) => f.year === 2026 && f.month === 7);
    scrub.value = String(startIndex);

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const stage = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x0e0f0c);
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.48;
    controls.maxDistance = 6;
    controls.rotateSpeed = 0.5;
    controls.zoomSpeed = 0.55;
    controls.autoRotate = !reducedMotion;
    controls.autoRotateSpeed = 0.22;

    scene.add(new THREE.AmbientLight(0xffffff, 0.78));
    const sun = new THREE.DirectionalLight(0xfff6ea, 0.85);
    sun.position.set(5, 2.2, 3);
    scene.add(sun);

    const starPositions = new Float32Array(420 * 3);
    for (let i = 0; i < 420; i++) {
      const radius = 28 + Math.random() * 50;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = radius * Math.cos(phi);
      starPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0x9a988e, size: 0.04, sizeAttenuation: true })
    );
    scene.add(stars);

    const globe = new THREE.Group();
    scene.add(globe);

    const earthMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), earthMat);
    globe.add(earth);

    function makeNdviMaterial() {
      return new THREE.MeshLambertMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
      });
    }

    const ndviA = new THREE.Mesh(new THREE.SphereGeometry(1.004, 96, 96), makeNdviMaterial());
    const ndviB = new THREE.Mesh(new THREE.SphereGeometry(1.008, 96, 96), makeNdviMaterial());
    ndviA.renderOrder = 2;
    ndviB.renderOrder = 2;
    ndviA.visible = false;
    ndviB.visible = false;
    globe.add(ndviA, ndviB);

    const bloomMat = new THREE.ShaderMaterial({
      uniforms: {
        mapNow: { value: null },
        mapPrev: { value: null },
        strength: { value: 1 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D mapNow;
        uniform sampler2D mapPrev;
        uniform float strength;
        varying vec2 vUv;
        void main() {
          vec4 nowC = texture2D(mapNow, vUv);
          vec4 prevC = texture2D(mapPrev, vUv);
          float gain = (nowC.g - nowC.r) - (prevC.g - prevC.r);
          float land = step(0.55, nowC.a) * step(0.55, prevC.a);
          float bloom = smoothstep(0.12, 0.30, gain) * land * strength;
          vec3 color = mix(vec3(0.98, 0.55, 0.95), vec3(0.86, 0.08, 1.0), smoothstep(0.12, 0.36, gain));
          gl_FragColor = vec4(color, bloom * 0.88);
        }
      `,
      transparent: true,
      depthWrite: false,
    });
    const bloom = new THREE.Mesh(new THREE.SphereGeometry(1.014, 96, 96), bloomMat);
    bloom.renderOrder = 3;
    bloom.visible = false;
    globe.add(bloom);

    function directionFromLatLon(lat, lon) {
      const phi = ((lon + 180) / 360) * Math.PI * 2;
      const theta = ((90 - lat) / 180) * Math.PI;
      return new THREE.Vector3(
        -Math.cos(phi) * Math.sin(theta),
        Math.cos(theta),
        Math.sin(phi) * Math.sin(theta)
      );
    }

    let flyTarget = null;
    function flyTo(lat, lon, dist) {
      flyTarget = directionFromLatLon(lat, lon).multiplyScalar(dist);
    }
    controls.addEventListener("start", () => {
      flyTarget = null;
    });

    flyTo(12, -28, 2.7);

    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin("anonymous");

    function loadTexture(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
          resolve(texture);
        }, undefined, reject);
      });
    }

    const EARTH = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg";

    function ndviUrl(frame) {
      const mm = String(frame.month).padStart(2, "0");
      const dd = String(frame.day).padStart(2, "0");
      const params = new URLSearchParams({
        SERVICE: "WMS",
        VERSION: "1.1.1",
        REQUEST: "GetMap",
        LAYERS: "MODIS_Terra_NDVI_8Day",
        FORMAT: "image/png",
        TRANSPARENT: "TRUE",
        SRS: "EPSG:4326",
        BBOX: "-180,-90,180,90",
        WIDTH: "4096",
        HEIGHT: "2048",
        TIME: `${frame.year}-${mm}-${dd}`,
      });
      return `https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?${params.toString()}`;
    }

    function frameKey(frame) {
      return `${frame.year}-${frame.month}-${frame.day}`;
    }

    function frameLabel(frame) {
      return `${frame.day} ${MONTHS[frame.month - 1]} ${frame.year}`;
    }

    const cache = new Map();
    let liveKeys = new Set();

    function remember(key, entry) {
      if (cache.has(key)) cache.delete(key);
      cache.set(key, entry);
      evict();
    }

    function evict() {
      for (const key of cache.keys()) {
        if (cache.size <= 3) break;
        if (liveKeys.has(key)) continue;
        cache.get(key).texture.dispose();
        cache.delete(key);
      }
    }

    function makeSampler(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);
      return (u, v) => {
        const x = Math.min(canvas.width - 1, Math.max(0, Math.floor(u * canvas.width)));
        const y = Math.min(canvas.height - 1, Math.max(0, Math.floor((1 - v) * canvas.height)));
        return ctx.getImageData(x, y, 1, 1).data;
      };
    }

    const pending = new Map();
    function loadFrame(frame) {
      const key = frameKey(frame);
      if (cache.has(key)) {
        const hit = cache.get(key);
        cache.delete(key);
        cache.set(key, hit);
        return Promise.resolve(hit);
      }
      if (pending.has(key)) return pending.get(key);
      const job = loadTexture(ndviUrl(frame))
        .then((texture) => {
          const entry = { texture, sampler: makeSampler(texture.image), frame };
          remember(key, entry);
          pending.delete(key);
          return entry;
        })
        .catch((error) => {
          pending.delete(key);
          throw error;
        });
      pending.set(key, job);
      return job;
    }

    let shown = ndviA;
    let hidden = ndviB;
    let index = startIndex;
    let currentEntry = null;
    let previousEntry = null;
    let requestId = 0;
    let playing = false;
    let bloomOn = true;
    let spinOn = !reducedMotion;
    let fade = null;

    function syncNdviLayer() {
      corner.hidden = !ndviSelected;
      key.hidden = !ndviSelected;
      ndviPanel.hidden = !ndviSelected;
      ndviA.visible = ndviSelected;
      ndviB.visible = ndviSelected;
      if (!ndviSelected) {
        bloom.visible = false;
        setStatus("");
      } else {
        applyBloom();
      }
    }

    function setStatus(text) {
      if (!ndviSelected || !text) {
        statusEl.classList.remove("show");
        statusEl.textContent = "";
        return;
      }
      statusEl.textContent = text;
      statusEl.classList.add("show");
    }

    function applyBloom() {
      const comparable = ndviSelected && bloomOn && currentEntry && previousEntry && index > 0
        && frameKey(previousEntry.frame) !== frameKey(currentEntry.frame);
      bloom.visible = comparable;
      if (!comparable) return;
      bloomMat.uniforms.mapNow.value = currentEntry.texture;
      bloomMat.uniforms.mapPrev.value = previousEntry.texture;
      bloomMat.uniforms.strength.value = 1;
    }

    function renderDate() {
      const frame = frames[index];
      dateLine.textContent = `${frame.day} ${MONTHS[frame.month - 1]} ${frame.year}`;
      frameCount.textContent = `${index + 1} / ${frames.length}`;
      scrub.value = String(index);
    }

    async function showFrame(nextIndex) {
      const my = ++requestId;
      index = nextIndex;
      renderDate();
      const frame = frames[index];
      const prevFrame = frames[index === 0 ? 0 : index - 1];
      setStatus(`Loading ${frameLabel(frame)}`);
      try {
        const now = await loadFrame(frame);
        if (my !== requestId) return;
        const prev = await loadFrame(prevFrame);
        if (my !== requestId) return;
        liveKeys = new Set([frameKey(frame), frameKey(prevFrame)]);
        currentEntry = now;
        previousEntry = prev;
        hidden.material.map = now.texture;
        hidden.material.needsUpdate = true;
        if (shown.material.map == null) {
          hidden.material.opacity = 1;
          shown.material.opacity = 0;
          const swap = shown;
          shown = hidden;
          hidden = swap;
          fade = null;
        } else if (reducedMotion) {
          shown.material.opacity = 0;
          hidden.material.opacity = 1;
          const swap = shown;
          shown = hidden;
          hidden = swap;
          fade = null;
        } else {
          hidden.material.opacity = 0;
          fade = { from: shown, to: hidden, t: 0 };
        }
        applyBloom();
        syncNdviLayer();
        evict();
        setStatus("");
        const upcoming = frames[Math.min(frames.length - 1, index + 1)];
        if (frameKey(upcoming) !== frameKey(frame)) {
          loadFrame(upcoming).then(() => evict()).catch(() => {});
        }
      } catch (error) {
        if (my !== requestId) return;
        setStatus("This date did not load. Try another month.");
        console.error(error);
      }
    }

    function classify(pixel, prevPixel) {
      const [r, g, b, a] = pixel;
      if (a < 40) {
        return { name: "Open water", note: "No NDVI for this point." };
      }
      const score = (g - r) / 255;
      let name = "Bare or arid";
      let note = "Soil or desert.";
      if (score > 0.22) {
        name = "Dense vegetation";
        note = "Closed canopy.";
      } else if (score > 0.08) {
        name = "Moderate vegetation";
        note = "Crops, grass, or open woodland.";
      } else if (score > -0.02) {
        name = "Sparse vegetation";
        note = "Thin cover.";
      }
      if (bloomOn && prevPixel && prevPixel[3] > 40 && index > 0) {
        const gain = score - (prevPixel[1] - prevPixel[0]) / 255;
        if (gain > 0.14) note = "Greener than the previous month.";
        else if (gain < -0.14) note = "Less green than the previous month.";
      }
      return { name, note };
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerInside = false;

    function readPointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      pointerInside = true;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(shown, false)[0];
      if (!hit || !hit.uv || !currentEntry) return;
      const sample = currentEntry.sampler(hit.uv.x, hit.uv.y);
      const prevSample = previousEntry ? previousEntry.sampler(hit.uv.x, hit.uv.y) : null;
      const lat = hit.uv.y * 180 - 90;
      const lon = hit.uv.x * 360 - 180;
      const reading = classify(sample, prevSample);
      const ns = lat >= 0 ? "N" : "S";
      const ew = lon >= 0 ? "E" : "W";
      klassEl.textContent = reading.name;
      coordEl.textContent = `${Math.abs(lat).toFixed(1)}°${ns}   ${Math.abs(lon).toFixed(1)}°${ew}   ${reading.note}`;
    }

    renderer.domElement.addEventListener("pointermove", readPointer);
    renderer.domElement.addEventListener("pointerleave", () => {
      pointerInside = false;
    });

    playBtn.addEventListener("click", () => {
      playing = !playing;
      playBtn.textContent = playing ? "Pause" : "Play";
      playBtn.setAttribute("aria-pressed", String(playing));
      if (playing) stepPlay();
    });

    bloomBtn.addEventListener("click", () => {
      bloomOn = !bloomOn;
      bloomBtn.setAttribute("aria-pressed", String(bloomOn));
      applyBloom();
    });

    spinBtn.addEventListener("click", () => {
      spinOn = !spinOn;
      spinBtn.setAttribute("aria-pressed", String(spinOn));
    });
    if (reducedMotion) spinBtn.setAttribute("aria-pressed", "false");

    scrub.addEventListener("input", () => {
      playing = false;
      playBtn.textContent = "Play";
      playBtn.setAttribute("aria-pressed", "false");
      showFrame(Number(scrub.value));
    });

    window.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      event.preventDefault();
      const delta = event.key === "ArrowRight" ? 1 : -1;
      const next = Math.min(frames.length - 1, Math.max(0, index + delta));
      playing = false;
      playBtn.textContent = "Play";
      showFrame(next);
    });

    async function stepPlay() {
      if (!playing) return;
      const next = (index + 1) % frames.length;
      await showFrame(next);
      if (playing) setTimeout(stepPlay, 1050);
    }

    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();
      if (fade) {
        fade.t += dt / 0.65;
        const k = Math.min(1, fade.t);
        fade.from.material.opacity = 1 - k;
        fade.to.material.opacity = k;
        if (k >= 1) {
          shown = fade.to;
          hidden = fade.from;
          hidden.material.opacity = 0;
          fade = null;
        }
      }
      if (flyTarget) {
        camera.position.lerp(flyTarget, 1 - Math.pow(0.001, dt));
        if (camera.position.distanceTo(flyTarget) < 0.02) flyTarget = null;
      }
      controls.autoRotate = spinOn && !flyTarget && !reducedMotion;
      controls.update();
      if (!reducedMotion) stars.rotation.y += dt * 0.008;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function fit() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", fit);
    fit();

    loadTexture(EARTH)
      .then((earthTex) => {
        earthMat.map = earthTex;
        earthMat.needsUpdate = true;
      })
      .catch(() => setStatus("Earth image did not load."));

    renderDate();
    animate();
    showFrame(startIndex);
  </script>
</body>
</html>
